name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build_test_docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Unit tests (sql-data-service)
        run: dotnet test services/sql-data-service/tests -c Release

      - name: Unit tests (telemetry-service)
        run: dotnet test services/telemetry-service/tests -c Release

      - name: Unit tests (rest-api)
        run: dotnet test services/rest-api/tests -c Release

      - name: Build docker images
        run: docker compose build

      - name: Start docker-compose stack
        run: docker compose up -d

      - name: Wait for REST API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5001/health > /dev/null; then
              echo "REST API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "REST API not healthy in time"
          docker compose ps
          docker compose logs --no-color --tail 200 rest-api
          exit 1

      - name: Integration tests (end-to-end real-time)
        env:
          REST_API_BASE_URL: "http://localhost:5001"
        run: dotnet test tests/integration -c Release

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

